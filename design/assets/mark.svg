<!--
  Vouch — the mark, 32px box.

  Two brackets holding a solid bar. A quote with something inside it, which is
  the whole product: a line lifted out of your resume, untouched.

  It inherits colour. Set `color` on the parent (or `fill`/`stroke` on the svg)
  and both brackets and the bar follow. On --v-bg-0 that is --v-ink; on a light
  ground it is --v-bg-0. It carries no background of its own on purpose — every
  real use in the app sits it straight on a surface.

  For the browser toolbar use favicon.svg instead. It is a different drawing
  with its own stroke weights, not this one shrunk.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="currentColor" role="img" aria-label="Vouch">
  <path d="M11 6 H5 V26 H11" fill="none" stroke="currentColor" stroke-width="3"/>
  <path d="M21 6 H27 V26 H21" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect x="13.5" y="6" width="5" height="20"/>
</svg>

[project]
name = "job-hunter"
version = "0.1.0"
description = "Evidence audit: checks every requirement in a job post against evidence in a resume."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-groq>=1.1",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
    "pdfplumber>=0.11",
    "pypdf>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]

[project.scripts]
audit = "audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
